# Local only. Do not expose this service publicly: demo roles are not authentication.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - LLM_PROVIDER=demo
    volumes:
      - adops_data:/app/data

volumes:
  adops_data:
